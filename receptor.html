<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Boss TV Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }

        /* Ocultamos cualquier interfaz de Google */
        cast-media-player {
            width: 100vw; height: 100vh;
            --splash-image: url('logo.png');
            --control-bar-height: 0px;
            --bottom-progress-bar-height: 0px;
            --logo-image: none;
        }

        #overlay-inactividad {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); color: white; justify-content: center; align-items: center;
            flex-direction: column; z-index: 1000;
        }
        .mensaje { font-size: 2.5em; font-weight: bold; margin-bottom: 30px; text-align: center; }
        .boton-ok { background: #9ACD32; color: #000; padding: 15px 50px; font-size: 2em; border-radius: 30px; font-weight: bold; }
    </style>
</head>
<body>

    <cast-media-player></cast-media-player>

    <div id="overlay-inactividad">
        <div class="mensaje">¿Sigues viendo la TV?<br>Presiona "OK" en tu control remoto para continuar.</div>
        <div class="boton-ok">OK</div>
    </div>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        const EventType = cast.framework.events.EventType;
        const PlayerState = cast.framework.messages.PlayerState;

        // Le decimos al receptor que no soporta el comando Pausa (bloquea pausas enviadas por senders).
        playerManager.removeSupportedMediaCommands(cast.framework.messages.Command.PAUSE, true);

        // --- CANALES ---
        const listaCanales = [
            { nombre: "XHTOL", url: "https://tv.vpnsolucionesboss.online/hls/XHTOL/playlist.m3u8" },
            { nombre: "Canal 5", url: "https://tv.vpnsolucionesboss.online/hls/Canal_Cinco/playlist.m3u8" },
            { nombre: "Las Estrellas", url: "https://tv.vpnsolucionesboss.online/hls/Las_Estrellas/playlist.m3u8" }
        ];
        let canalActual = 0;

        // --- ANTI-PAUSA ---
        // 1) Toda carga (del celular o del control del TV) arranca con autoplay.
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, (loadRequest) => {
            loadRequest.autoplay = true;
            return loadRequest;
        });

        // 2) Red de seguridad: si el reproductor queda en PAUSED, se reanuda.
        let temporizadorReanudar;
        function reanudarSiEstaPausado() {
            clearTimeout(temporizadorReanudar);
            temporizadorReanudar = setTimeout(() => {
                if (playerManager.getPlayerState() === PlayerState.PAUSED) {
                    playerManager.play();
                }
            }, 250);
        }
        playerManager.addEventListener(EventType.PAUSE, reanudarSiEstaPausado);
        playerManager.addEventListener(EventType.PLAYER_LOAD_COMPLETE, reanudarSiEstaPausado);

        // --- LÓGICA DE INACTIVIDAD (Prueba rápida: 30s + 15s) ---
        let timeoutInactividad;
        let timeoutApagado;
        const overlay = document.getElementById('overlay-inactividad');

        function reiniciarTemporizador() {
            clearTimeout(timeoutInactividad);
            clearTimeout(timeoutApagado);
            overlay.style.display = 'none';

            timeoutInactividad = setTimeout(() => {
                overlay.style.display = 'flex';
                timeoutApagado = setTimeout(() => { window.close(); }, 15000);
            }, 30000);
        }

        reiniciarTemporizador();

        // --- CAMBIO DE CANAL ---
        function cambiarCanal(direccion) {
            canalActual = (canalActual + direccion + listaCanales.length) % listaCanales.length;

            const request = new cast.framework.messages.LoadRequestData();
            request.autoplay = true;

            const mediaInfo = new cast.framework.messages.MediaInformation();
            mediaInfo.contentId = listaCanales[canalActual].url;
            mediaInfo.streamType = cast.framework.messages.StreamType.LIVE;
            mediaInfo.contentType = 'application/x-mpegURL';
            mediaInfo.metadata = new cast.framework.messages.GenericMediaMetadata();
            mediaInfo.metadata.title = listaCanales[canalActual].nombre;
            request.media = mediaInfo;

            playerManager.load(request)
                .then(() => playerManager.play())
                .catch((err) => console.error('Error al cambiar de canal:', err));

            // Revisión extra por si algo pausa justo después de cargar
            setTimeout(reanudarSiEstaPausado, 1500);

            reiniciarTemporizador();
        }

        // --- CONTROL REMOTO FÍSICO ---
        // Fase de CAPTURA (true) y stopImmediatePropagation: el evento no llega a CAF ni a otros handlers.
        const TECLAS_ARRIBA = ['ArrowUp', 'ChannelUp'];
        const TECLAS_ABAJO = ['ArrowDown', 'ChannelDown'];

        window.addEventListener('keydown', function(e) {
            const esArriba = TECLAS_ARRIBA.includes(e.key);
            const esAbajo = TECLAS_ABAJO.includes(e.key);
            const esEnter = e.key === 'Enter';

            if (esArriba || esAbajo || esEnter) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
            }

            if (overlay.style.display === 'flex') {
                if (esEnter) reiniciarTemporizador();
                return;
            }

            if (esArriba) cambiarCanal(1);
            else if (esAbajo) cambiarCanal(-1);
        }, true);

        // Nota: se quitó autoPauseDuration = 0 para descartar que interfiera con el buffering.
        const playbackConfig = new cast.framework.PlaybackConfig();
        context.start({ playbackConfig: playbackConfig });
    </script>
</body>
</html>
