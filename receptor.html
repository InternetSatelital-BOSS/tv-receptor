<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Boss TV Receiver</title>
    <!-- SDK de Google Cast -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        
        cast-media-player { width: 100vw; height: 100vh; --splash-image: url('logo.png'); }

        /* EL ESCUDO MÁGICO: Atrapa los clics antes de que lleguen al reproductor de Google */
        #trampa-controles {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 900; outline: none; background: transparent; cursor: default;
        }

        /* Aviso de Inactividad */
        #overlay-inactividad {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.95); color: white; justify-content: center; align-items: center;
            flex-direction: column; z-index: 1000;
        }
        .mensaje { font-size: 2.5em; font-weight: bold; margin-bottom: 30px; text-align: center; }
        .boton-ok { background: #9ACD32; color: #000; padding: 15px 50px; font-size: 2em; border-radius: 30px; font-weight: bold; }
    </style>
</head>
<body>
    
    <cast-media-player></cast-media-player>
    
    <!-- Esta es la capa que robará todos los botones del control físico -->
    <div id="trampa-controles" tabindex="0"></div>
    
    <div id="overlay-inactividad">
        <div class="mensaje">¿Sigues viendo la TV?<br>Presiona "OK" en tu control remoto para continuar.</div>
        <div class="boton-ok">OK</div>
    </div>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        
        const listaCanales = [
            { nombre: "XHTOL", url: "https://tv.vpnsolucionesboss.online/hls/XHTOL/playlist.m3u8" },
            { nombre: "Canal 5", url: "https://tv.vpnsolucionesboss.online/hls/Canal_Cinco/playlist.m3u8" },
            { nombre: "Las Estrellas", url: "https://tv.vpnsolucionesboss.online/hls/Las_Estrellas/playlist.m3u8" }
        ];
        let canalActual = 0;

        const trampa = document.getElementById('trampa-controles');
        const overlay = document.getElementById('overlay-inactividad');

        // 1. OBLIGAR A LA TV BOX A MIRAR LA TRAMPA (Reafirmamos el foco cada medio segundo)
        setInterval(() => {
            if (document.activeElement !== trampa) {
                trampa.focus();
            }
        }, 500);
        trampa.focus();

        // 2. LÓGICA DE INACTIVIDAD (Pruebas Rápidas: 30s + 15s)
        let timeoutInactividad;
        let timeoutApagado;
        
        function reiniciarTemporizador() {
            clearTimeout(timeoutInactividad);
            clearTimeout(timeoutApagado);
            overlay.style.display = 'none';
            trampa.focus(); // Regresamos el foco al cristal
            
            timeoutInactividad = setTimeout(() => {
                overlay.style.display = 'flex'; 
                timeoutApagado = setTimeout(() => {
                    window.close(); 
                }, 15000); 
            }, 30000); 
        }

        reiniciarTemporizador(); 

        // 3. ESCUCHAR LOS BOTONES *EXCLUSIVAMENTE* DESDE EL CRISTAL INVISIBLE
        trampa.addEventListener('keydown', function(e) {
            
            e.preventDefault(); 
            e.stopPropagation();

            if (overlay.style.display === 'flex') {
                if (e.key === 'Enter') { 
                    reiniciarTemporizador();
                }
                return; 
            }

            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                if (e.key === 'ArrowUp') {
                    canalActual = (canalActual + 1 >= listaCanales.length) ? 0 : canalActual + 1;
                } else if (e.key === 'ArrowDown') {
                    canalActual = (canalActual - 1 < 0) ? listaCanales.length - 1 : canalActual - 1;
                }
                
                let request = new cast.framework.messages.LoadRequestData();
                request.autoplay = true; 
                
                let mediaInfo = new cast.framework.messages.MediaInformation();
                mediaInfo.contentId = listaCanales[canalActual].url;
                mediaInfo.streamType = cast.framework.messages.StreamType.LIVE;
                mediaInfo.contentType = 'application/x-mpegURL';
                mediaInfo.metadata = new cast.framework.messages.GenericMediaMetadata();
                mediaInfo.metadata.title = listaCanales[canalActual].nombre;
                
                request.media = mediaInfo;
                
                // Hacemos la carga. Para el reproductor, esta orden llegó "de la nada" (como el celular)
                playerManager.load(request);
                
                reiniciarTemporizador();
            }
        });

        // Apagar configuración por defecto
        const playbackConfig = new cast.framework.PlaybackConfig();
        playbackConfig.autoPauseDuration = 0; 
        context.start({playbackConfig: playbackConfig});
    </script>
</body>
</html>
