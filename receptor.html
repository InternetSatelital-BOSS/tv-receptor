<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Boss TV Receiver</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: sans-serif; }
        /* Apagamos cualquier outline que pueda robar el foco */
        cast-media-player { width: 100vw; height: 100vh; outline: none; --splash-image: url('logo.png'); }
    </style>
</head>
<body>
    
    <cast-media-player></cast-media-player>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        
        const listaCanales = [
            { nombre: "XHTOL", url: "https://tv.vpnsolucionesboss.online/hls/XHTOL/playlist.m3u8" },
            { nombre: "Canal 5", url: "https://tv.vpnsolucionesboss.online/hls/Canal_Cinco/playlist.m3u8" },
            { nombre: "Las Estrellas", url: "https://tv.vpnsolucionesboss.online/hls/Las_Estrellas/playlist.m3u8" }
        ];
        
        let canalActual = 0;

        // 1. SINCRONIZADOR EXACTO POR NOMBRE
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,
            request => {
                if (request.media && request.media.metadata && request.media.metadata.title) {
                    let idx = listaCanales.findIndex(c => c.nombre === request.media.metadata.title);
                    if (idx !== -1) canalActual = idx;
                }
                request.autoplay = true;
                return request;
            }
        );

        // 2. ESCUDO ANTI-CELULAR: El teléfono ya no tiene permiso de pausar la TV. 
        // Solo el control físico de la TV podrá pausarla.
        playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.PAUSE,
            request => {
                return null; // Destruye la orden de pausa que envía el celular
            }
        );

        // --- TEMPORIZADOR DE INACTIVIDAD (3 Horas) ---
        let temporizadorApagado;
        function reiniciarReloj() {
            clearTimeout(temporizadorApagado);
            temporizadorApagado = setTimeout(() => { window.close(); }, 10800000);
        }
        reiniciarReloj();

        // 3. MODO DIOS DEL TECLADO (El "true" al final es lo que roba el control a Android TV)
        let bloqueando = false;
        
        window.addEventListener('keydown', function(e) {
            // Destruimos la orden para que Android TV no cause pausas
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();

            if (bloqueando) return; // Anti-rebote para controles locos

            if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                bloqueando = true;
                setTimeout(() => { bloqueando = false; }, 600); // Bloquea medio segundo

                // Cálculo matemático para cambiar canal
                if (e.key === 'ArrowUp') {
                    canalActual = (canalActual + 1) % listaCanales.length;
                } else {
                    canalActual = (canalActual - 1 + listaCanales.length) % listaCanales.length;
                }

                let request = new cast.framework.messages.LoadRequestData();
                request.autoplay = true;
                request.media = new cast.framework.messages.MediaInformation();
                request.media.contentId = listaCanales[canalActual].url;
                request.media.streamType = cast.framework.messages.StreamType.LIVE;
                request.media.contentType = 'application/x-mpegURL';
                request.media.metadata = new cast.framework.messages.GenericMediaMetadata();
                request.media.metadata.title = listaCanales[canalActual].nombre;

                playerManager.load(request).then(() => {
                    playerManager.play(); // Fuerza Play sí o sí
                }).catch(()=>{});

                reiniciarReloj();

            } else if (e.key === 'Enter') {
                bloqueando = true;
                setTimeout(() => { bloqueando = false; }, 600);
                
                if (playerManager.getPlayerState() === cast.framework.messages.PlayerState.PLAYING) {
                    playerManager.pause();
                } else {
                    playerManager.play();
                }
                reiniciarReloj();
            }
        }, true); // <-- ESTE 'true' ES LA MAGIA QUE NOS FALTABA

        const playbackConfig = new cast.framework.PlaybackConfig();
        playbackConfig.autoPauseDuration = 0; // Desactiva pausas nativas de HLS
        context.start({playbackConfig: playbackConfig});
    </script>
</body>
</html>
